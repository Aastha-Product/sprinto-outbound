<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprinto Outbound</title>
<meta name="description" content="Turn a list of company domains into evidence-backed prospect intelligence and personalised outreach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Editorial Intelligence. Three experiences on one page: public homepage (#/), workspace (#app),
     decision report (#app/report/...). Ink + ivory, one restrained signal-lime accent, big Manrope headlines. */
  :root {
    --ink: #151C29; --ink-2: #2B3445; --ivory: #F8F8F4; --paper: #FFFFFF; --lime: #C8F36B; --lime-deep: #A9D94A;
    --slate: #596B84; --stone: #E7E9E3; --stone-2: #D7DAD2;
    --amber-bg: #F6E7BF; --amber: #6B4E0A; --red-bg: #F6D5CF; --red: #8A2A1E;
    --display: "Manrope", ui-sans-serif, system-ui, sans-serif;
    --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 14px; --r-sm: 10px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; } a:hover { color: var(--slate); }
  h1, h2, h3, .display { font-family: var(--display); color: var(--ink); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .muted { color: var(--slate); } .small { font-size: 13.5px; } .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--slate); }
  .icon { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
  .hl { background: linear-gradient(transparent 58%, var(--lime) 58%, var(--lime) 92%, transparent 92%); padding: 0 .06em; }

  /* buttons */
  .btn { display: inline-flex; gap: 10px; align-items: center; justify-content: center; font: 600 15px/1 var(--body); padding: 14px 20px;
         border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--ivory); cursor: pointer; text-decoration: none;
         transition: transform .15s ease, background .15s ease; }
  .btn:hover { color: var(--ivory); transform: translateY(-1px); }
  .btn.lime { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  .btn.lime:hover { background: var(--lime-deep); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--stone-2); }
  .btn.ghost:hover { background: var(--paper); color: var(--ink); }
  .btn.sm { padding: 9px 14px; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .textlink { font-weight: 600; text-decoration: underline; text-decoration-color: var(--lime-deep); text-underline-offset: 4px; text-decoration-thickness: 2px; }

  /* top bars */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(248,248,244,.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
  .topbar.scrolled, .topbar.app { border-bottom-color: var(--stone); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--ivory); z-index: 40; }
  .topbar .wrap { display: flex; align-items: center; gap: 24px; height: 68px; }
  .wordmark { display: inline-flex; align-items: center; gap: 10px; font: 800 15px var(--display); letter-spacing: .08em; text-decoration: none; color: var(--ink); }
  .wordmark i { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); position: relative; display: inline-block; }
  .wordmark i::after { content: ""; position: absolute; inset: 7px 5px 7px 7px; background: var(--lime); border-radius: 2px; }
  .topnav { display: flex; gap: 22px; margin-left: 12px; }
  .topnav a { text-decoration: none; font-weight: 500; color: var(--ink-2); font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent; }
  .topnav a[aria-current="page"] { border-bottom-color: var(--ink); color: var(--ink); }
  .topbar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .mode { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--slate); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stone-2); display: inline-block; }
  .dot.on { background: var(--lime-deep); box-shadow: 0 0 0 3px rgba(200,243,107,.35); }
  @media (max-width: 760px) { .topnav.home { display: none; } .mode { display: none; } .topnav.appnav { gap: 14px; margin-left: 0; overflow-x: auto; } .topbar .wrap { gap: 14px; } }

  /* ============================== homepage */
  .hero { position: relative; overflow: hidden; }
  .gridbg { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--stone) 1px, transparent 1px), linear-gradient(90deg, var(--stone) 1px, transparent 1px);
    background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse at 30% 30%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 30% 30%, #000 0%, transparent 70%); opacity: .7; }
  .hero-grid { position: relative; display: grid; gap: 56px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center; padding-block: 72px 88px; }
  @media (max-width: 960px) { .hero-grid { grid-template-columns: 1fr; padding-block: 48px 64px; } }
  .hero h1 { font-size: clamp(40px, 5.4vw, 60px); line-height: 1.04; font-weight: 800; margin: 18px 0 22px; }
  .hero .lede { font-size: 19px; color: var(--ink-2); max-width: 34em; }
  .hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
  .demo { background: var(--paper); border-radius: 22px; padding: 28px; box-shadow: 0 30px 80px -40px rgba(21,28,41,.35), 0 0 0 1px var(--stone); position: relative; }
  .demo .tag { position: absolute; top: -12px; left: 24px; background: var(--ink); color: var(--ivory); font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; }
  .demo-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .demo h3 { font-size: 30px; font-weight: 800; }
  .ring { --p: 0; width: 104px; height: 104px; border-radius: 50%; flex: none; display: grid; place-items: center;
          background: conic-gradient(var(--lime-deep) calc(var(--p) * 1%), var(--stone) 0); }
  .ring > div { width: 82px; height: 82px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; text-align: center; }
  .ring b { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; } .ring span { display: block; font-size: 11px; color: var(--slate); }
  .ring.big { width: 148px; height: 148px; } .ring.big > div { width: 118px; height: 118px; } .ring.big b { font-size: 42px; }
  .checks { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 0; }
  .checks li { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 13px 0; border-top: 1px solid var(--stone); align-items: center; }
  .checks .k { font: 600 11.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
  .checks .v { font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
  .band { padding-block: 88px; }
  .band.dark { background: var(--ink); color: var(--ivory); }
  .band.dark h2, .band.dark h3 { color: var(--ivory); } .band.dark .muted { color: #A9B4C6; }
  .section-head { max-width: 760px; margin-bottom: 48px; }
  .section-head h2 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; font-weight: 800; margin-top: 12px; }
  .section-head p { margin-top: 16px; font-size: 18px; color: var(--ink-2); }
  .band.dark .section-head p { color: #C9D1DE; }
  .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgba(255,255,255,.15); }
  .compare > div { padding: 32px 32px 8px 0; }
  .compare > div + div { padding-left: 32px; border-left: 1px solid rgba(255,255,255,.15); }
  .compare b { display: block; font: 800 clamp(44px, 6vw, 72px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .compare .after b { color: var(--lime); }
  @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } .compare > div + div { padding-left: 0; border-left: 0; border-top: 1px solid rgba(255,255,255,.15); } }
  .steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
  .steps3 .n { font: 800 64px/1 var(--display); color: var(--stone-2); }
  .steps3 h3 { font-size: 26px; font-weight: 800; margin: 14px 0 10px; }
  .steps3 p { color: var(--ink-2); }
  .steps3 .sub { margin-top: 14px; font-size: 13.5px; color: var(--slate); border-top: 1px solid var(--stone); padding-top: 12px; }
  @media (max-width: 860px) { .steps3 { grid-template-columns: 1fr; gap: 32px; } }
  .trust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .trust article { background: var(--paper); border-radius: var(--r); padding: 28px; box-shadow: 0 0 0 1px var(--stone); }
  .trust h3 { font-size: 21px; font-weight: 800; margin-bottom: 10px; } .trust p { color: var(--ink-2); font-size: 15.5px; }
  .mock { margin-top: 20px; font-size: 13px; background: var(--ivory); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 8px; }
  .mock .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  @media (max-width: 960px) { .trust { grid-template-columns: 1fr; } }
  .results { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 56px; align-items: center; }
  @media (max-width: 900px) { .results { grid-template-columns: 1fr; gap: 32px; } }
  .bars { display: grid; gap: 14px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 36px; gap: 14px; align-items: center; font-size: 15px; }
  .barrow .track { height: 12px; background: var(--stone); border-radius: 999px; overflow: hidden; }
  .barrow .track i { display: block; height: 100%; background: var(--ink); border-radius: 999px; width: 0; transition: width .9s cubic-bezier(.2,.7,.2,1); }
  .barrow.q .track i { background: var(--lime-deep); }
  .bigstat { font: 800 clamp(64px, 9vw, 112px)/.9 var(--display); font-variant-numeric: tabular-nums; }
  .cta-band { text-align: center; } .cta-band h2 { font-size: clamp(32px, 4.4vw, 52px); font-weight: 800; line-height: 1.08; max-width: 18ch; margin: 0 auto 28px; }
  footer.site { padding-block: 40px; border-top: 1px solid var(--stone); font-size: 14px; color: var(--slate); }
  footer.site .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: space-between; }
  footer.site a { color: var(--ink-2); }

  /* ============================== workspace */
  .app-main { padding-block: 40px 96px; }
  .app-head h1 { font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.1; }
  .app-head p { margin-top: 10px; color: var(--ink-2); font-size: 17px; max-width: 46em; }
  .stack { display: grid; gap: 28px; }
  .panel { background: var(--paper); border-radius: 20px; padding: 28px; box-shadow: 0 0 0 1px var(--stone); min-width: 0; }
  .panel h2 { font-size: 22px; font-weight: 800; }
  .welcome { background: var(--ink); color: var(--ivory); border-radius: 20px; padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 20px; }
  .welcome h2 { color: var(--ivory); font-size: 24px; font-weight: 800; }
  .welcome ol { margin: 14px 0 0; padding-left: 20px; color: #C9D1DE; display: grid; gap: 4px; }
  .welcome .x { align-self: start; background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--ivory); border-radius: 999px; padding: 8px 14px; cursor: pointer; font: 500 13px var(--body); }
  @media (max-width: 640px) { .welcome { grid-template-columns: 1fr; } }
  .composer { display: grid; gap: 16px; }
  .chipbox { min-height: 132px; border-radius: var(--r); background: var(--ivory); box-shadow: inset 0 0 0 1px var(--stone-2); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; cursor: text; }
  .chipbox:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
  .dchip { display: inline-flex; gap: 6px; align-items: center; background: var(--paper); border-radius: 999px; padding: 6px 8px 6px 12px; font: 500 14px var(--body); box-shadow: 0 0 0 1px var(--stone-2); animation: pop .18s ease; }
  .dchip.bad { background: var(--red-bg); box-shadow: none; color: var(--red); }
  .dchip button { border: 0; background: transparent; cursor: pointer; color: var(--slate); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; font-size: 15px; line-height: 1; }
  .dchip button:hover { background: var(--stone); color: var(--ink); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .chipinput { flex: 1; min-width: 220px; border: 0; background: transparent; font: 400 16px var(--body); color: var(--ink); padding: 6px 4px; outline: none; }
  .composer-foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--slate); }
  .facts b { color: var(--ink); font-weight: 600; }
  .twocol { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 960px) { .twocol { grid-template-columns: 1fr; } }
  .plist { display: grid; }
  .prow { display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 2fr) auto; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--stone); text-decoration: none; color: inherit; }
  .prow:hover { color: inherit; background: linear-gradient(90deg, transparent, var(--ivory) 10%, var(--ivory) 90%, transparent); }
  .prow .co b { display: block; font: 700 17px var(--display); } .prow .co span { font-size: 13px; color: var(--slate); }
  .prow .why { font-size: 14px; color: var(--ink-2); }
  .prow .sc { font: 800 22px var(--display); font-variant-numeric: tabular-nums; text-align: right; min-width: 48px; }
  @media (max-width: 720px) { .prow { grid-template-columns: 1fr auto; } .prow .why { grid-column: 1 / -1; } }
  .pill { display: inline-flex; gap: 6px; align-items: center; font: 600 12.5px var(--body); padding: 5px 11px; border-radius: 999px; white-space: nowrap; background: var(--stone); color: var(--ink-2); }
  .pill.qualified, .pill.sent, .pill.observed, .pill.done { background: var(--lime); color: var(--ink); }
  .pill.review, .pill.inferred, .pill.dry_run, .pill.stopped, .pill.skipped { background: var(--amber-bg); color: var(--amber); }
  .pill.failed, .pill.error, .pill.blocked { background: var(--red-bg); color: var(--red); }
  .pill.running { background: var(--ink); color: var(--ivory); }
  .pill.running::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .continue { display: grid; gap: 6px; padding: 20px; border-radius: var(--r); background: var(--ivory); box-shadow: inset 0 0 0 1px var(--stone); text-decoration: none; }
  .continue b { font: 800 22px var(--display); }
  .empty { padding: 32px 8px; text-align: center; color: var(--slate); }

  /* research progress */
  .now { background: var(--ink); color: var(--ivory); border-radius: 20px; padding: 28px; display: grid; gap: 18px; }
  .now h2 { color: var(--ivory); font-size: 26px; font-weight: 800; }
  .now .doing { color: #C9D1DE; font-size: 16px; }
  .rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rail div { display: grid; gap: 8px; font-size: 13px; color: #A9B4C6; }
  .rail i { display: block; height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
  .rail .done i { background: var(--lime); } .rail .done { color: var(--ivory); }
  .rail .active { color: var(--ivory); }
  .rail .active i::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--lime); border-radius: 999px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .queue { display: flex; flex-wrap: wrap; gap: 8px; }
  .queue span { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: #C9D1DE; }
  .queue span.done { background: rgba(200,243,107,.18); color: var(--lime); } .queue span.cur { background: var(--lime); color: var(--ink); font-weight: 600; }
  .summary { border-radius: 20px; padding: 28px; background: var(--lime); display: grid; gap: 14px; animation: rise .5s ease both; }
  .summary h2 { font-size: 28px; font-weight: 800; }
  .summary .nums { display: flex; flex-wrap: wrap; gap: 28px; }
  .summary .nums b { display: block; font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; } .summary .nums span { font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .fchip { border: 0; background: var(--paper); box-shadow: 0 0 0 1px var(--stone-2); border-radius: 999px; padding: 8px 14px; font: 500 14px var(--body); cursor: pointer; color: var(--ink-2); }
  .fchip[aria-pressed="true"] { background: var(--ink); color: var(--ivory); box-shadow: none; }
  .retry { margin-top: 6px; }

  /* report */
  .rep-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding-block: 12px 8px; }
  .rep-hero h1 { font-size: clamp(40px, 5.6vw, 64px); font-weight: 800; line-height: 1; }
  .rep-hero .meta { margin-top: 12px; color: var(--slate); font-size: 14px; }
  .rep-hero .verdict { margin-top: 18px; font: 600 clamp(18px, 2vw, 22px)/1.45 var(--display); max-width: 36em; color: var(--ink-2); letter-spacing: -.01em; }
  @media (max-width: 760px) { .rep-hero { grid-template-columns: 1fr; } }
  .keyfacts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--stone-2); border-bottom: 1px solid var(--stone-2); }
  .keyfacts > div { padding: 18px 18px 18px 0; } .keyfacts > div + div { padding-left: 18px; border-left: 1px solid var(--stone); }
  .keyfacts .k { font: 600 11.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
  .keyfacts .v { margin-top: 6px; font: 700 17px var(--display); overflow-wrap: anywhere; }
  @media (max-width: 760px) { .keyfacts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .keyfacts > div:nth-child(3) { padding-left: 0; border-left: 0; } }
  .uncertain { border-radius: var(--r); background: var(--amber-bg); padding: 18px 22px; color: #4A3608; }
  .uncertain h3 { font-size: 15px; font-weight: 800; color: #4A3608; }
  .uncertain ul { margin: 8px 0 0; padding-left: 20px; font-size: 15px; }
  .chapter { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; padding-top: 40px; border-top: 1px solid var(--stone-2); }
  .chapter > header .n { font: 800 44px/1 var(--display); color: var(--stone-2); }
  .chapter > header h2 { font-size: 22px; font-weight: 800; margin-top: 8px; }
  .chapter > header p { margin-top: 8px; font-size: 14px; color: var(--slate); }
  @media (max-width: 860px) { .chapter { grid-template-columns: 1fr; gap: 16px; } }
  .reveal { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .kv { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 10px 24px; margin: 0; }
  .kv dt { color: var(--slate); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 10px; } }
  .rub { display: grid; grid-template-columns: minmax(0, 1fr) 72px 170px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--stone); }
  .rub .name { font-weight: 600; } .rub .name small { font-weight: 400; color: var(--slate); }
  .rub .bar { height: 8px; border-radius: 999px; background: var(--stone); overflow: hidden; margin-top: 8px; }
  .rub .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; width: 0; transition: width .8s cubic-bezier(.2,.7,.2,1); }
  .rub .pts { font: 700 16px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .rub { grid-template-columns: 1fr auto; } .rub .pill { grid-column: 1 / -1; justify-self: start; } }
  .evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ev { position: relative; display: block; padding: 12px 14px; border-radius: var(--r-sm); background: var(--ivory); text-decoration: none; color: inherit; }
  .ev:hover, .ev:focus-visible { color: inherit; background: #F0F2EA; }
  .ev .c { font-weight: 500; } .ev .s { font-size: 12.5px; color: var(--slate); margin-top: 2px; }

async function runSteps(runId, domain, from) {
  const r = runs[runId];

  for (let step = from; step <= 6; step++) {
    r.current = domain; r.running[domain] = step; rerenderIf("run", runId); rerenderIf("report", runId);
    let out;
    try { out = await api(`/api/runs/${encodeURIComponent(runId)}/step`, {method: "POST", body: JSON.stringify({domain, step})}); }
    catch (e) { out = {status: "error", message: e.message, artifact: {status: "error", reasoning: e.message}}; }
    if (out.artifact) r.artifacts[domain][FILES[step]] = out.artifact;
    if (out.brief) r.briefs[domain] = out.brief;
    if (out.status === "error") r.briefs[domain] = Object.assign({}, r.briefs[domain], {status: "failed", failed_step: step, error: out.message});
    delete r.running[domain];

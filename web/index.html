<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outbound Intelligence</title>
<meta name="description" content="Sprinto outbound intelligence workspace: qualify prospects with evidence, find the right decision-maker, prepare outreach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: fixed evergreen sidebar (top bar on phones) + one workspace view at a time (hash routes).
     Light-first enterprise theme; status colours are semantic and always paired with a text label + icon. */
  :root {
    --nav: #142D35; --nav-ink: #DCE8E3; --nav-muted: #8FA9A1; --nav-active: #1E4048;
    --bg: #F4F7F5; --surface: #FFFFFF; --line: #DFE7E3; --line-strong: #C9D6D0;
    --ink: #13252B; --ink-2: #3D5158; --muted: #6A7C80;
    --primary: #16866B; --primary-ink: #FFFFFF; --primary-hover: #12705A; --mint: #E9F2EE;
    --amber-bg: #F2E6CF; --amber: #8A5A12;
    --green-bg: #DDF0E7; --green: #13714F;
    --red-bg: #F8E1DE; --red: #A8352A;
    --grey-bg: #ECEFEE; --grey: #5D6B6E;
    --blue-bg: #E1ECF7; --blue: #275D93;
    --r: 10px; --r-sm: 8px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; overflow-wrap: anywhere; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { margin: 0; font-weight: 600; color: var(--ink); text-wrap: balance; }
  h1 { font-size: 22px; letter-spacing: -0.01em; } h2 { font-size: 16px; } h3 { font-size: 14px; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .num, td.num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .icon { width: 16px; height: 16px; flex: none; vertical-align: -3px; }

  /* shell */
  .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100%; }
  .side { background: var(--nav); color: var(--nav-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px;
          position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; color: #fff; }
  .brand strong { display: block; font-size: 14px; font-weight: 600; color: #fff; }
  .brand span { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--nav-muted); }
  .nav { display: grid; gap: 2px; }
  .nav a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); color: var(--nav-ink); font-weight: 500; }
  .nav a:hover { background: var(--nav-active); text-decoration: none; }
  .nav a[aria-current="page"] { background: var(--nav-active); color: #fff; box-shadow: inset 3px 0 0 var(--primary); }
  .nav .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 4px; }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 6px; font-size: 12px; color: var(--nav-muted); }
  .side-foot .pill { display: inline-flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nav-muted); display: inline-block; flex: none; }
  .dot.ok { background: #3FBF8F; } .dot.warn { background: #E1B04A; } .dot.bad { background: #E26B5E; }
  main { min-width: 0; padding: 28px 32px 64px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
  .page { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; flex-direction: row; align-items: center; gap: 12px;
            padding: 10px max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
    .brand span, .side-foot { display: none; }
    .nav { display: flex; gap: 2px; }
    .nav a { white-space: nowrap; padding: 6px 10px; } .nav .sep { display: none; }
    main { padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px max(16px, env(safe-area-inset-right, 0px)); }
  }

  /* surfaces */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
  .card-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
  .grid-2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  @media (max-width: 1000px) { .grid-2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
  .kpi b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12.5px; }
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid; }
  .banner.info { background: var(--mint); border-color: #CFE3DA; color: var(--ink-2); }
  .banner.warn { background: var(--amber-bg); border-color: #E6D2AC; color: #5E3F0E; }
  .banner.err { background: var(--red-bg); border-color: #EFC5BF; color: #7B241B; }

  /* buttons */
  .btn { display: inline-flex; gap: 8px; align-items: center; justify-content: center; font: 500 14px/1 var(--font); padding: 10px 16px;
         border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; background: var(--primary); color: var(--primary-ink); }
  .btn:hover { background: var(--primary-hover); text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--mint); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }

  /* status */
  .status { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .status .icon { width: 13px; height: 13px; }
  .s-qualified, .s-done, .s-sent, .s-observed { background: var(--green-bg); color: var(--green); }
  .s-review, .s-insufficient_data, .s-stopped, .s-dry_run, .s-skipped, .s-inferred { background: var(--amber-bg); color: var(--amber); }
  .s-failed, .s-error, .s-blocked { background: var(--red-bg); color: var(--red); }
  .s-rejected, .s-pending, .s-none { background: var(--grey-bg); color: var(--grey); }
  .s-running { background: var(--blue-bg); color: var(--blue); }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: #FAFCFB; }
  tbody tr:hover { background: #FAFCFB; }
  td.num { text-align: right; }
  .co b { display: block; font-weight: 600; } .co span { color: var(--muted); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 500 12.5px var(--font); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--nav); color: #fff; border-color: var(--nav); }
  input[type=search], textarea, select { font: 400 14px/1.5 var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong);
         border-radius: var(--r-sm); padding: 8px 10px; width: 100%; }
  textarea { font-family: var(--mono); font-size: 13px; min-height: 180px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

  /* new run */
  .stepnum { font: 600 12px var(--font); color: var(--primary); letter-spacing: .06em; }
  .cfg-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .cfg-row:last-child { border-bottom: 0; }
  .cfg-row b { display: block; font-weight: 500; } .cfg-row span { color: var(--muted); font-size: 12.5px; }
  .validation { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .validation .bad { color: var(--red); } .validation .good { color: var(--green); }

  /* phases */
  .phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; min-width: 260px; }
  .phase { border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 500; background: var(--grey-bg); color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase.done { background: var(--green-bg); color: var(--green); } .phase.running { background: var(--blue-bg); color: var(--blue); }
  .phase.stopped { background: var(--grey-bg); color: var(--ink-2); } .phase.error { background: var(--red-bg); color: var(--red); }
  .activity { font-size: 12px; color: var(--blue); margin-top: 4px; }

  /* report */
  .dossier-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .score { text-align: right; } .score b { font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; } .score span { display: block; color: var(--muted); font-size: 12px; }
  .sec-title { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; } .sec-title .n { color: var(--primary); font-weight: 600; font-size: 12px; }
  .kv { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 6px 18px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }
  .rows { display: grid; gap: 0; }
  .rubric { display: grid; grid-template-columns: minmax(0, 1fr) 90px 170px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bar { height: 6px; border-radius: 3px; background: var(--grey-bg); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--primary); }
  @media (max-width: 640px) { .rubric { grid-template-columns: 1fr; gap: 4px; } }
  .trail { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .trail li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
  .trail .tdot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--mint); color: var(--primary); }
  .ev { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); } .ev li { margin-bottom: 4px; }
  q { color: var(--muted); }
  .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .box { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; background: #FBFDFC; min-width: 0; }
  .box h3 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .email { white-space: pre-wrap; font: 400 14px/1.65 var(--font); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 18px; margin: 8px 0 0; }
  details.trace { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  details.trace summary { cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13px; }
  .trace-body { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 10px; }
  .secret { display: inline-flex; align-items: center; gap: 6px; }
  .eye { display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--line-strong);
         background: var(--surface); color: var(--ink-2); cursor: pointer; flex: none; }
  .eye:hover { background: var(--mint); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .doc p, .doc li { color: var(--ink-2); max-width: 75ch; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  return {good, bad, dupes};
}

  if (sts.includes("stopped")) return "stopped";

}

      el("p", {}, "The model never assigns points. A rule earns points only when its quote is found on a page we actually fetched, or in a cited search result. The same evidence always gives the same score, and research rounds can add evidence but never silently lose it.")),
    el("section", {class: "card"}, el("h2", {}, "Read more"), el("ul", {class: "ev"},
      el("li", {}, link(`${gh}#architecture`, "Architecture and guardrails (README)")),
      el("li", {}, link(`${gh}/blob/main/docs/ICP.md`, "ICP and scoring rubric")),
      el("li", {}, link(`${gh}/blob/main/docs/EVIDENCE_MAP.md`, "Evidence map and source policy")),
      el("li", {}, link(`${gh}/blob/main/docs/DEFENSE_NOTES.md`, "Defense notes")))));
}

route();
Promise.all([loadHealth(), icpReady().catch(() => null), api("/api/quota").then(x => (quota = x)).catch(() => null)]).then(() => {
